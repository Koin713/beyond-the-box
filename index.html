                -webkit-font-smoothing: antialiased;
            }
            .hidden { display: none !important; }

            /* PS5-style backdrop: soft blue light waves on black */
            .staticrypt-content {
                min-height: 100%;
                display: grid;
                place-items: center;
                padding: 32px 16px;
                background:
                    radial-gradient(120% 60% at 50% 115%, rgba(0, 112, 209, 0.45), transparent 60%),
                    radial-gradient(80% 40% at 15% 100%, rgba(83, 177, 255, 0.18), transparent 70%),
                    #000;
            }
            .wave { position: fixed; left: -10%; right: -10%; bottom: 18%; height: 2px; background: linear-gradient(90deg, transparent, rgba(83, 177, 255, 0.5), transparent); filter: blur(1px); animation: drift 9s ease-in-out infinite; }

            @keyframes drift { 0%, 100% { transform: translateX(-4%) rotate(-1deg); } 50% { transform: translateX(4%) rotate(1deg); } }

            .staticrypt-page { position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center; }
            .mark { width: 64px; height: 64px; margin: 0 auto 28px; }
            .staticrypt-title { font-size: 40px; font-weight: 300; letter-spacing: 0.2px; margin: 0 0 8px; }
            .lead { color: rgba(255, 255, 255, 0.72); font-size: 17px; line-height: 1.5; margin: 0 0 36px; }

            .staticrypt-password-container { position: relative; margin: 0 0 16px; }
            .staticrypt-password-container input {
                width: 100%; height: 52px; border-radius: 9999px; border: 1px solid rgba(229, 229, 229, 0.25);
                background: rgba(18, 19, 20, 0.9); color: #fff; font: inherit; font-size: 17px; padding: 0 56px 0 24px; outline: 0;
            }
            .staticrypt-password-container input:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(83, 177, 255, 0.25); }
            .staticrypt-password-container input::placeholder { color: rgba(229, 229, 229, 0.5); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; cursor: pointer; opacity: 0.6; filter: invert(1); }

            label.staticrypt-remember { display: flex; align-items: center; justify-content: center; gap: 10px; color: rgba(255, 255, 255, 0.72); font-size: 15px; margin: 0 0 28px; cursor: pointer; }
            .staticrypt-remember input { width: 18px; height: 18px; accent-color: var(--blue); }

            .start { display: grid; justify-items: center; gap: 12px; }
            .x-button {
                width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
                background: radial-gradient(circle at 40% 30%, #3a3d44, #0c0d0f 70%);
                box-shadow: 0 0 0 2px rgba(122, 166, 255, 0.55), 0 10px 30px rgba(0, 112, 209, 0.35);
                display: grid; place-items: center; transition: transform 120ms ease, box-shadow 120ms ease;
            }

            .x-button:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
            .x-button svg { width: 34px; height: 34px; }
            .press { font-size: 15px; letter-spacing: 0.4px; color: rgba(255, 255, 255, 0.8); animation: pulse 2.4s ease-in-out infinite; }

            .foot { margin-top: 40px; font-size: 13px; color: rgba(229, 229, 229, 0.45); }

            @media (prefers-reduced-motion: reduce) { .wave, .press, .staticrypt-spinner { animation: none; } }
